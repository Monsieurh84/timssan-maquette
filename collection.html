<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantalons homme — Timssan</title>
<meta name="description" content="Jogpants, pantalons 7/8 et bermudas longs pour homme, cousus main à Casablanca.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body data-page="collection">
<main>
  <div class="wrap">
    <nav class="crumbs mono" aria-label="Fil d'Ariane" id="crumbs"></nav>
    <div class="col-hero">
      <div><div class="mono muted" id="eyebrow" style="margin-bottom:12px"></div><h1 class="disp" id="colTitle"></h1></div>
      <p class="lead" id="colIntro"></p>
    </div>
  </div>
  <div class="toolbar">
    <div class="wrap">
      <div class="chips" id="chips" role="group" aria-label="Collections"></div>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <label><input type="checkbox" id="onlyStock"> En stock</label>
        <label for="sort">Trier
          <select id="sort"><option value="feat">Mis en avant</option><option value="asc">Prix croissant</option><option value="desc">Prix décroissant</option><option value="new">Promotions d'abord</option></select>
        </label>
        <span class="mono muted" id="countLbl"></span>
      </div>
    </div>
  </div>
  <section style="padding-block:40px 80px">
    <div class="wrap">
      <div class="grid-p" id="colGrid"></div>
      <div class="seo-txt" style="margin-top:80px"><h2 id="seoH"></h2><p id="seoP"></p></div>
    </div>
  </section>
  <div class="wrap reass">
    <div><b>Livraison offerte 24/48h</b><span>France métropolitaine</span></div>
    <div><b>Échange offert</b><span>Pas la bonne taille ? On échange</span></div>
    <div><b>14 jours pour changer d'avis</b><span>Retours simples</span></div>
    <div><b>Paiement 3 ou 4 fois</b><span>Sans frais, 100 % sécurisé</span></div>
  </div>
  <div style="height:72px"></div>
</main>
<script src="data.js?v=3"></script>
<script src="app.js?v=3"></script>
<script>
(() => {
  const { $, card, seo } = window.TIMSSAN;
  const C = window.COLLECTIONS;
  const key = new URLSearchParams(location.search).get("c") || "pantalons";
  const col = C[key] || C.pantalons;
  $("#crumbs").innerHTML = `<a href="index.html">Accueil</a><span>/</span><span aria-current="page">${col.title}</span>`;
  $("#eyebrow").textContent = col.eyebrow; $("#colTitle").textContent = col.title; $("#colIntro").textContent = col.intro;
  $("#seoH").textContent = col.title + " Timssan"; $("#seoP").textContent = col.seo;
  const chipKeys = ["pantalons", "jogpants", "pantalons-7-8", "bermudas-longs", "hauts", "parfum"];
  $("#chips").innerHTML = chipKeys.map(k => `<a class="chip" href="collection.html?c=${k}" aria-pressed="${k === key}">${C[k].title}</a>`).join("");
  const items = window.PRODUCTS.filter(p => col.cats.includes(p.cat));
  function render() {
    let list = items.slice();
    if ($("#onlyStock").checked) list = list.filter(p => p.colors.some(c => c.avail.length));
    const s = $("#sort").value;
    if (s === "asc") list.sort((a, b) => a.price - b.price);
    if (s === "desc") list.sort((a, b) => b.price - a.price);
    if (s === "new") list.sort((a, b) => (b.compare ? 1 : 0) - (a.compare ? 1 : 0));
    $("#colGrid").innerHTML = list.length ? list.map(card).join("") : `<p class="nores">Aucun modèle disponible avec ce filtre.</p>`;
    $("#countLbl").textContent = list.length + (list.length > 1 ? " modèles" : " modèle");
  }
  $("#sort").onchange = render; $("#onlyStock").onchange = render; render();
  seo(`${col.title} homme — Timssan`, col.intro, {
    "@context": "https://schema.org", "@type": "CollectionPage", "name": col.title,
    "breadcrumb": { "@type": "BreadcrumbList", "itemListElement": [{ "@type": "ListItem", "position": 1, "name": "Accueil", "item": "https://www.timssan.com/" }, { "@type": "ListItem", "position": 2, "name": col.title }] }
  });
})();
</script>
</body>
</html>
